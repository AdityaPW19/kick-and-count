<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#086ac4">
	<title>Kick &amp; Count with Sparky</title>
	<link rel="preload" href="assets/bg/main-menu-bg.png" as="image">
	<link rel="preload" href="assets/fonts/fredoka-400.ttf" as="font" type="font/ttf" crossorigin>
	<link rel="preload" href="assets/fonts/fredoka-700.ttf" as="font" type="font/ttf" crossorigin>
	<link rel="stylesheet" href="menu.css">
	<link rel="stylesheet" href="scene.css">
	<link rel="stylesheet" href="intro.css">
	<script src="menu.js" defer></script>
	<script src="intro.js" defer></script>
	<script src="scene.js" defer></script>
</head>
<body>
	<main class="menu" aria-label="Kick and Count with Sparky main menu" aria-busy="true">
		<div class="stadium" aria-hidden="true"></div>
		<div class="stage" id="stage">
			<div class="sparky-enter" id="sparky-enter" aria-hidden="true">
				<div class="sparky-hover">
					<div class="ground-shadow"></div>
					<div class="sparky" id="sparky"></div>
				</div>
			</div>
			<div class="football-enter" id="football-enter" aria-hidden="true">
				<img class="football" id="football" src="assets/objects/football.png" alt="" draggable="false">
			</div>
			<div class="power-enter" id="power-enter" aria-hidden="true">
				<img class="power-football" src="assets/graphics/power-football.png" alt="" draggable="false">
			</div>
			<div class="impact" id="impact" aria-hidden="true">
				<i></i><i></i><i></i><i></i><i></i><i></i>
			</div>
			<div class="title-enter" id="title-enter">
				<img class="title-art" src="assets/graphics/title-art.png" alt="Kick and Count with Sparky" draggable="false">
			</div>
			<div class="play-enter" id="play-enter">
				<div class="play-halo" aria-hidden="true"></div>
				<span class="twinkle twinkle-one" aria-hidden="true">✦</span>
				<span class="twinkle twinkle-two" aria-hidden="true">✦</span>
				<span class="twinkle twinkle-three" aria-hidden="true">✦</span>
				<button class="play-button" id="play-button" type="button" aria-label="Play Kick and Count with Sparky" disabled>
					<img src="assets/ui/play-button.png" alt="" draggable="false">
				</button>
			</div>
			<div class="game-loader" id="game-loader" role="status" aria-label="Loading" hidden>
				<div class="loader-orbit" aria-hidden="true">
					<div class="loader-track"></div>
					<div class="loader-ball-ring">
						<span class="loader-small-ball" style="--i: 0"></span>
						<span class="loader-small-ball" style="--i: 1"></span>
						<span class="loader-small-ball" style="--i: 2"></span>
						<span class="loader-small-ball" style="--i: 3"></span>
						<span class="loader-small-ball" style="--i: 4"></span>
						<span class="loader-small-ball" style="--i: 5"></span>
						<span class="loader-small-ball" style="--i: 6"></span>
						<span class="loader-small-ball" style="--i: 7"></span>
						<span class="loader-small-ball" style="--i: 8"></span>
						<span class="loader-small-ball" style="--i: 9"></span>
						<span class="loader-small-ball" style="--i: 10"></span>
						<span class="loader-small-ball" style="--i: 11"></span>
					</div>
					<span class="loader-star loader-star-one">✦</span>
					<span class="loader-star loader-star-two">✦</span>
				</div>
			</div>
		</div>
		<div class="loading" id="loading" role="status"><span></span>Warming up…</div>
		<p class="sr-only" id="menu-status" role="status" aria-live="polite"></p>
	</main>

	<section class="game-scene" id="game-scene" aria-label="Kick and Count field — scene systems preview" hidden>
		<div class="scene-backdrop" aria-hidden="true"></div>
		<div class="scene-frame" id="scene-frame">
			<div class="scene-camera" id="scene-camera">
				<div class="field-world" aria-hidden="true"></div>
				<div class="goal-zone" data-zone="Goal zone">
					<div class="goal-shadow" aria-hidden="true"></div>
					<img src="assets/goalpost/goalpost.png" alt="Football goal" draggable="false">
				</div>
				<div class="quantity-display" id="quantity-display" data-zone="Quantity display" role="img" aria-label="Four footballs"></div>
				<div class="scene-sparky" id="scene-sparky" data-zone="Sparky / close-up anchor">
					<div class="sparky-floor-shadow" aria-hidden="true"></div>
					<img src="assets/animations/sparky-sprites/emotes/sparky_proud_cocky_hand_gesture.png" alt="Sparky, your football coach" draggable="false">
				</div>
				<div class="ball-choice-zone" id="ball-choice-zone" data-zone="Football choices · up to six" role="group" aria-label="Test footballs"></div>
			</div>
		</div>
		<div class="scene-hud" id="scene-hud">
			<div class="scene-preview-label"><span></span> SCENE PREVIEW <small id="shot-label">WIDE SHOT</small></div>
			<button class="scene-pause-button" id="scene-pause" type="button" aria-label="Pause">
				<img src="assets/ui/pause-cta.png" alt="" draggable="false">
			</button>
			<div class="scene-lab" id="scene-lab">
				<button class="lab-toggle" id="lab-toggle" type="button" aria-expanded="false" aria-controls="lab-controls">Scene lab <span aria-hidden="true">⚙</span></button>
				<div class="lab-controls" id="lab-controls" hidden>
					<div class="lab-heading">DIRECTOR’S DESK <span>Temporary test controls</span></div>
					<div class="lab-row" role="group" aria-label="Camera shots">
						<button type="button" data-shot="wide" aria-pressed="true">Wide</button>
						<button type="button" data-shot="close" aria-pressed="false">Sparky close-up</button>
						<button type="button" data-shot="dramatic" aria-pressed="false">Dramatic</button>
					</div>
					<label class="lab-slider">Football quantity <output id="count-output">4</output><input id="display-count" type="range" min="1" max="20" value="4"></label>
					<label class="lab-slider">Display width <output id="width-output">420</output><input id="display-width" type="range" min="300" max="620" step="10" value="420"></label>
					<div class="lab-row" role="group" aria-label="Display styles">
						<button type="button" data-display="count" aria-pressed="true">Count</button>
						<button type="button" data-display="message" aria-pressed="false">Message</button>
						<button type="button" data-display="celebrate" aria-pressed="false">Celebrate</button>
					</div>
					<label class="zone-toggle"><input type="checkbox" id="show-zones"> Show scene areas</label>
					<label class="lab-slider">Test balls <output id="ball-count-output">3</output><input id="test-ball-count" type="range" min="3" max="6" value="3"></label>
					<div class="lab-row"><button type="button" id="replay-ball-entry">Replay ball entrance</button></div>
				</div>
			</div>
		</div>
		<div class="scene-pause-overlay" id="scene-pause-overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
			<div class="scene-pause-card">
				<span class="pause-eyebrow">TIME OUT!</span>
				<h2 id="pause-title">Catch your breath.</h2>
				<p>The pitch will be right here.</p>
				<button type="button" id="scene-resume">Back to the pitch <span aria-hidden="true">▶</span></button>
				<button class="pause-secondary" type="button" id="scene-wide">Resume in wide shot</button>
			</div>
		</div>
		<p class="sr-only" id="scene-status" role="status" aria-live="polite"></p>
	</section>

	<section class="rotate-overlay" aria-labelledby="rotate-title">
		<div class="rotate-card">
			<div class="rotate-stars" aria-hidden="true">✦ <span>✦</span> ✦</div>
			<div class="phone-scene" aria-hidden="true">
				<div class="rotation-ring"></div>
				<div class="phone"><div class="phone-pitch"><span>⚽</span></div></div>
				<span class="rotation-arrow">↻</span>
			</div>
			<p class="rotate-eyebrow">LET’S KICK THINGS OFF!</p>
			<h1 id="rotate-title">Turn for the fun!</h1>
			<p>Rotate your phone sideways</p>
			<!-- <div class="landscape-badge"><span aria-hidden="true">↔</span> Best played in landscape</div> -->
		</div>
	</section>
	<noscript><div class="no-script">Enable JavaScript to kick things off with Sparky.</div></noscript>
</body>
</html>
